<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Escanea DNI peruano (8 dígitos) con cámara.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Lector DNI</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
<div class="app">
  <h1>Escanear DNI</h1>
  <p class="hint">Alinea el DNI con la guía y mete el Code 39 en la <b>franja roja</b> (8 dígitos).</p>

  <div class="camera-wrap" id="cameraWrap">
    <video id="camera" playsinline muted autoplay></video>
    <div class="overlay" id="overlay">
      <span>Pulsa <b>Escanear</b></span>
    </div>
    <div class="scan-mask" id="scanMask" hidden>
      <!-- Guía tarjeta ISO ID-1: 85,4 × 54 mm ≈ 1.58 : 1 -->
      <div class="card-guide" aria-hidden="true"></div>
      <!-- ROI Code 39: franja ~5 : 1 -->
      <div class="scan-box" id="scanBox">
        <i class="scan-line"></i>
        <span class="scan-label">CODE 39 · 8 DÍGITOS</span>
      </div>
    </div>
  </div>

  <button id="startBtn" class="primary">Escanear</button>
  <p id="status" class="status">Listo</p>
  <div id="banner" class="banner" hidden></div>

  <section class="list-wrap">
    <div class="list-head">
      <h2>Listado</h2>
      <span id="count">0</span>
    </div>
    <ul id="list" class="list">
      <li class="empty">Aún no hay escaneos</li>
    </ul>
  </section>
</div>
</body>
</html>
