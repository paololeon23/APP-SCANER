<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Escanea DNI, escucha el número y revisa duplicados.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Lector DNI</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
<div class="app">
  <h1>Escanear DNI</h1>
  <p class="hint">Apunta al código del <b>costado</b> (rayas finas). Ahí está el DNI. El bot lo lee solo.</p>

  <div class="camera-wrap" id="cameraWrap">
    <video id="camera" playsinline muted autoplay></video>
    <div class="overlay" id="overlay">
      <span>Pulsa <b>Escanear</b></span>
    </div>
    <div class="scan-line" id="scanLine" hidden></div>
  </div>

  <button id="startBtn" class="primary">Escanear</button>
  <p id="status" class="status">Listo</p>

  <div id="banner" class="banner" hidden></div>

  <section class="list-wrap">
    <div class="list-head">
      <h2>Listado</h2>
      <span id="count">0</span>
    </div>
    <ul id="list" class="list">
      <li class="empty">Aún no hay escaneos</li>
    </ul>
  </section>
</div>
</body>
</html>
